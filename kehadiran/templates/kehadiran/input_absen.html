<!DOCTYPE html>
<html lang="id">
<head>
    <title>Sistem Absen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Pencatat Absen</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'input_absen' %}">Catat Absen</a>
            <a class="nav-link" href="{% url 'rekap_bulanan' %}">Rekap Bulanan</a>
            <a class="nav-link text-danger" href="/admin/">Panel Admin</a>
        </div>
    </div>
</nav>
<div class="container">
    <h3>Catat Absen Personel</h3>
    <div class="card p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Nama Personel</label>
                <select name="personel" class="form-select" required>
                    <option value="">-- Pilih Nama --</option>
                    {% for p in personel_aktif %}
                    <option value="{{ p.id }}">{{ p.nama }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label>Tanggal</label>
                <input type="date" name="tanggal" class="form-control" value="{{ hari_ini }}" required>
            </div>
            <div class="mb-3">
                <label>Deskripsi Kegiatan</label>
                <textarea name="deskripsi" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Simpan Absen</button>
        </form>
    </div>
</div>
