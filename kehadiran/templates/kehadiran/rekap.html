<!DOCTYPE html>
<html lang="id">
<head>
    <title>Sistem Absen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Pencatat Absen</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'input_absen' %}">Catat Absen</a>
            <a class="nav-link" href="{% url 'rekap_bulanan' %}">Rekap Bulanan</a>
            <a class="nav-link text-danger" href="/admin/">Panel Admin</a>
        </div>
    </div>
</nav>
<div class="container">
    <h3>Rekapitulasi Absen</h3>
    <form method="GET" class="d-flex gap-2 mb-4">
        <select name="bulan" class="form-select w-auto">
            <!-- Sederhananya, list angka 1-12. Anda bisa mengetik manual option 1 s/d 12 -->
            <option value="9" {% if bulan_pilih == 9 %}selected{% endif %}>September</option>
            <option value="10" {% if bulan_pilih == 10 %}selected{% endif %}>Oktober</option>
            <option value="11" {% if bulan_pilih == 11 %}selected{% endif %}>November</option>
        </select>
        <input type="number" name="tahun" class="form-control w-auto" value="{{ tahun_pilih }}">
        <button type="submit" class="btn btn-success">Filter</button>
    </form>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
            <tr>
                <th>Nama Personel</th>
                <th>Total Hari Masuk</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rekap %}
            <tr>
                <td>{{ r.personel__nama }}</td>
                <td>{{ r.total_hadir }} hari</td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center">Tidak ada data di bulan ini.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
